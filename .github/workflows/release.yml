name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      # Pinned to the 11.x line: npm 12 blocks dependency install scripts by
      # default, which prevents better-sqlite3 from building its native binding.
      - name: Upgrade npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: auth happens via OIDC Trusted Publishing.
      - name: Publish to npm
        run: npm publish --access public
